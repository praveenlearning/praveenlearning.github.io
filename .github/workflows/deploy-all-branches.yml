# Publishes every branch to GitHub Pages in one deploy:
#   v3          -> /  and  /v3/
#   main        -> /legacy/
#   <branch>    -> /<branch>/
#
# Branches are discovered at run time, so adding or deleting one needs no edit here.
#
# Pages must be set to Settings -> Pages -> Source: "GitHub Actions" for this to
# take effect. While the source is still "Deploy from a branch", this workflow runs
# but changes nothing.
name: Deploy all branches

on:
  push:
    branches: [main]
  # GitHub reads a workflow from the branch that was pushed, so a push to another
  # branch will not trigger this one. Use "Run workflow" in the Actions tab after
  # pushing any branch other than main.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # bring every branch, not just the triggering one

      - name: Assemble one directory per branch
        run: |
          set -euo pipefail
          mkdir -p site

          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin); do
            branch="${ref#origin/}"

            # refs/remotes/origin/HEAD shortens to plain "origin", not "origin/HEAD",
            # so both spellings have to be skipped or a bogus /origin/ gets published.
            case "$branch" in HEAD|origin) continue ;; esac

            # Where each branch lands. v3 is the published portfolio and takes the
            # root, while also staying at /v3/ so existing links keep working. main
            # is the earlier compact layout and moves to /legacy/.
            case "$branch" in
              v3)   dests="site site/v3" ;;
              main) dests="site/legacy" ;;
              *)    dests="site/$branch" ;;
            esac

            for dest in $dests; do
              # Staged in a temp directory rather than extracted straight into
              # $dest: for v3 the destination IS site, and pruning at that level
              # would delete the sibling branch directories already published
              # beside it. Prune the staging copy, then move it into place.
              stage="$(mktemp -d)"
              git archive "$ref" | tar -x -C "$stage"

              # Keep only what the site actually serves. This is a whitelist on
              # purpose: a blacklist silently published anything newly added to a
              # branch, which is how specs/ reached the live site. Anything not
              # named here is repo furniture and does not ship.
              find "$stage" -mindepth 1 -maxdepth 1 \
                ! -name 'index.html' \
                ! -name 'styles.css' \
                ! -name 'print.css' \
                ! -name 'data.js' \
                ! -name 'index.js' \
                ! -name '.nojekyll' \
                ! -name 'assets' \
                -exec rm -rf {} +

              mkdir -p "$dest"
              cp -R "$stage"/. "$dest"/
              rm -rf "$stage"

              echo "published $branch -> ${dest#site}/"
            done
          done

          touch site/.nojekyll
          echo "--- tree ---"
          find site -maxdepth 2 -name index.html | sort
          du -sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
