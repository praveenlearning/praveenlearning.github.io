<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Praveen Bathula | Senior Data Engineer</title>
    <meta name="description" content="Portfolio of Praveen Bathula, Senior Data Engineer: metadata-driven ETL, PySpark, dbt, Airflow, AWS and GCP data platforms." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128202;</text></svg>" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" media="print" href="print.css" />
    <script src="https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.umd.cjs"></script>
    <script src="data.js" defer></script>
    <script src="index.js" defer></script>
  </head>
  <body>
    <div class="document-actions" aria-label="Resume actions">
      <button class="theme-toggle" type="button" title="Switch between light and dark">
        <span class="theme-toggle-label">Dark</span>
      </button>
      <button class="docx-download" type="button" title="Download as a Word document">Download DOCX</button>
      <button class="pdf-download" type="button" title="Download as a PDF">Download PDF</button>
    </div>

    <!-- Plain-text header for ATS parsers and the printed PDF text stream. -->
    <div class="ats-pre-header" aria-hidden="true"></div>

    <main class="page">
      <header class="profile-header">
        <h1 class="profile-name"></h1>
        <p class="profile-role"></p>
        <div class="contact contact-items"></div>
        <ul class="highlights"></ul>
      </header>

      <section class="section summary-section">
        <h2>Summary</h2>
        <p class="profile-summary"></p>
        <!-- Keyword-dense variant: hidden on screen, swapped in by print.css. -->
        <p class="profile-summary-ats"></p>
      </section>

      <div class="content-columns">
        <aside class="column-left">
          <section class="section skills-section">
            <h2>Key Skills</h2>
            <div class="key-skills"></div>
          </section>

          <section class="section education-section">
            <h2>Education</h2>
            <div class="all-education"></div>
          </section>
        </aside>

        <div class="column-right">
          <section class="section projects-section">
            <h2>Work Experience</h2>
            <div class="all-experiences"></div>
          </section>
        </div>
      </div>

<!--      <footer class="page-footer">-->
<!--        <p>Built as a static page and hosted on GitHub Pages. Content lives in <code>data.js</code>.</p>-->
<!--      </footer>-->
    </main>
  </body>
</html>
